<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>接続詞・前置詞・接続副詞 TOEIC頻出語彙</title>
  <style>
    :root {
      --ink: #16202a;
      --muted: #66758a;
      --line: #d8e0e8;
      --paper: #f4f7fb;
      --white: #fff;
      --head: #eef4fb;
      --blue: #2358d8;
      --green: #0d8b68;
      --orange: #c0691b;
      --red: #b73535;
      --violet: #6b4fd2;
      --cyan: #0c86a0;
      --rose: #be3c74;
      --lime: #5a8f22;
      --soft-blue: #eef4ff;
      --soft-green: #ecf8f3;
      --soft-orange: #fff4e8;
      --soft-red: #fff0f0;
      --shadow: 0 22px 55px rgba(23, 32, 42, .13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(35, 88, 216, .13), transparent 32%),
        radial-gradient(circle at 92% 8%, rgba(13, 139, 104, .12), transparent 31%),
        linear-gradient(180deg, #eef4fb 0%, var(--paper) 280px, #f8fafc 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    button {
      font: inherit;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px;
    }

    header {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: end;
      margin-bottom: 18px;
      padding: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .93), rgba(255, 255, 255, .72)),
        linear-gradient(90deg, rgba(35, 88, 216, .14), rgba(13, 139, 104, .09));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 0;
      line-height: 1.25;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px;
    }

    .credit {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      margin-bottom: 18px;
      box-shadow: 0 10px 28px rgba(23, 32, 42, .08);
    }

    .tab {
      min-width: 144px;
      min-height: 44px;
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
    }

    .tab.active {
      color: white;
      background: var(--ink);
      box-shadow: 0 8px 18px rgba(22, 32, 42, .2);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .sheet {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sheet-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, #ffffff, #f4f8fc);
      font-weight: 900;
    }

    .sheet-title span:last-child {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 11px 12px;
      vertical-align: top;
      text-align: left;
      overflow-wrap: anywhere;
    }

    th {
      background: var(--head);
      color: #1f2a37;
      font-size: 13px;
      text-align: center;
      font-weight: 900;
    }

    tbody tr {
      border-left: 7px solid var(--group-color, var(--blue));
    }

    tbody tr:nth-child(even) {
      background: #fbfdff;
    }

    tbody tr:hover {
      background: var(--group-soft, var(--soft-blue));
    }

    td.term {
      font-weight: 900;
      font-size: 17px;
      line-height: 1.28;
    }

    .meaning {
      font-weight: 800;
      color: #263445;
    }

    .merged-cell {
      vertical-align: middle;
      background: var(--group-soft, #f8fafc);
    }

    .merged-cell.meaning {
      color: #1f2a37;
      font-size: 15px;
    }

    .pos {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      min-height: 28px;
      padding: 3px 8px;
      border-radius: 999px;
      color: white;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .25);
    }

    .group-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid color-mix(in srgb, var(--group-color) 42%, white);
      border-radius: 8px;
      background: var(--group-soft);
      color: var(--group-color);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .mobile-vocab {
      display: none;
    }

    .mobile-vocab-list {
      display: grid;
      gap: 10px;
    }

    .mobile-vocab-card {
      position: relative;
      display: grid;
      gap: 10px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(23, 32, 42, .08);
    }

    .mobile-vocab-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: var(--group-color, var(--blue));
    }

    .mobile-vocab-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-left: 4px;
    }

    .mobile-vocab-term {
      margin: 0;
      font-size: 21px;
      line-height: 1.18;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .mobile-vocab-grid {
      display: grid;
      gap: 8px;
    }

    .mobile-field {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--group-soft, #f8fafc);
    }

    .mobile-field span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 2px;
    }

    .mobile-field strong {
      display: block;
      overflow-wrap: anywhere;
    }

    .conj {
      background: var(--blue);
    }

    .prep {
      background: var(--green);
    }

    .adv {
      background: var(--orange);
    }

    .inf {
      background: #6d4cc2;
    }

    .pattern {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: #243447;
    }

    .pattern-button {
      width: 100%;
      min-height: 36px;
      padding: 7px 9px;
      border: 1px dashed color-mix(in srgb, var(--group-color, var(--blue)) 40%, var(--line));
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
      color: #243447;
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: background .14s ease, border-color .14s ease, transform .14s ease;
    }

    .pattern-button:hover {
      transform: translateY(-1px);
      border-color: var(--group-color, var(--blue));
      background: var(--group-soft, var(--soft-blue));
    }

    .structure-example {
      display: none;
      position: fixed;
      z-index: 40;
      width: min(420px, calc(100vw - 24px));
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .97);
      box-shadow: var(--shadow);
    }

    .structure-example.visible {
      display: block;
      animation: rise .18s ease-out;
    }

    .structure-example::before {
      content: "";
      position: absolute;
      top: 18px;
      left: -9px;
      width: 16px;
      height: 16px;
      border-left: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
      transform: rotate(45deg);
    }

    .structure-example.left-tail::before {
      left: auto;
      right: -9px;
      border-left: 0;
      border-bottom: 0;
      border-right: 1px solid var(--line);
      border-top: 1px solid var(--line);
    }

    .structure-example h2 {
      margin: 0;
      color: var(--example-color, var(--blue));
      font-size: 17px;
      letter-spacing: 0;
    }

    .structure-example-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      margin-bottom: 10px;
    }

    .structure-close {
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 900;
    }

    .structure-close:hover {
      border-color: var(--example-color, var(--blue));
      background: color-mix(in srgb, var(--example-color, var(--blue)) 10%, white);
    }

    .structure-example p {
      margin: 0;
    }

    .structure-example .example-en {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.35;
    }

    .structure-example .example-ja {
      margin-top: 8px;
      color: #475569;
      font-weight: 800;
    }

    .example-highlight {
      padding: 1px 5px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--example-color, var(--blue)) 18%, white);
      color: var(--example-color, var(--blue));
      font-weight: 950;
    }

    .hint-line {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0 0;
    }

    .hint-card {
      min-height: 86px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      font-size: 13px;
      box-shadow: 0 10px 26px rgba(23, 32, 42, .08);
      position: relative;
      overflow: hidden;
    }

    .hint-card strong {
      display: block;
      margin-bottom: 4px;
    }

    .hint-card::before,
    .category-card::before,
    .problem::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: var(--accent, var(--blue));
    }

    .guide-shell {
      display: grid;
      gap: 16px;
    }

    .guide-type-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .guide-type-button {
      min-height: 116px;
      padding: 18px;
      border: 1px solid color-mix(in srgb, var(--guide-color, var(--blue)) 30%, var(--line));
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .96), rgba(255, 255, 255, .78)),
        color-mix(in srgb, var(--guide-color, var(--blue)) 12%, white);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      box-shadow: 0 14px 34px rgba(23, 32, 42, .09);
      position: relative;
      overflow: hidden;
    }

    .guide-type-button::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: var(--guide-color, var(--blue));
    }

    .guide-type-button.active {
      color: white;
      background: var(--guide-color, var(--blue));
      border-color: var(--guide-color, var(--blue));
      transform: translateY(-2px);
    }

    .guide-type-button strong {
      display: block;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .guide-type-button span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.35;
    }

    .guide-type-button.active span {
      color: rgba(255, 255, 255, .86);
    }

    .guide-board {
      min-height: 260px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
    }

    .guide-empty {
      display: grid;
      min-height: 214px;
      place-items: center;
      color: var(--muted);
      font-size: 24px;
      font-weight: 900;
      text-align: center;
    }

    .guide-board-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .guide-board-head h2 {
      margin: 0;
      color: var(--guide-color, var(--blue));
      font-size: 34px;
      line-height: 1.1;
    }

    .guide-pattern-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .guide-pattern-button {
      min-height: 132px;
      padding: 18px;
      border: 1px solid color-mix(in srgb, var(--guide-color, var(--blue)) 32%, var(--line));
      border-radius: 8px;
      background: color-mix(in srgb, var(--guide-color, var(--blue)) 9%, white);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .guide-pattern-button.active,
    .guide-pattern-button:hover {
      border-color: var(--guide-color, var(--blue));
      background: color-mix(in srgb, var(--guide-color, var(--blue)) 16%, white);
    }

    .guide-pattern-label {
      display: block;
      color: var(--guide-color, var(--blue));
      font-size: 18px;
      font-weight: 950;
    }

    .guide-pattern-main {
      display: block;
      margin-top: 8px;
      font-size: 42px;
      font-weight: 950;
      line-height: 1.05;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .guide-example-panel {
      display: none;
      margin-top: 16px;
      padding: 18px;
      border: 1px solid color-mix(in srgb, var(--guide-color, var(--blue)) 28%, var(--line));
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 36px rgba(23, 32, 42, .1);
    }

    .guide-example-panel.visible {
      display: block;
      animation: rise .18s ease-out;
    }

    .guide-example-kicker {
      color: var(--guide-color, var(--blue));
      font-size: 17px;
      font-weight: 950;
    }

    .guide-example-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .guide-close {
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid color-mix(in srgb, var(--guide-color, var(--blue)) 34%, var(--line));
      border-radius: 8px;
      background: color-mix(in srgb, var(--guide-color, var(--blue)) 8%, white);
      color: var(--guide-color, var(--blue));
      cursor: pointer;
      font-size: 13px;
      font-weight: 950;
      white-space: nowrap;
    }

    .guide-close:hover {
      background: var(--guide-color, var(--blue));
      color: white;
    }

    .guide-example-en {
      margin: 10px 0 0;
      font-size: 27px;
      font-weight: 950;
      line-height: 1.35;
    }

    .guide-example-note {
      margin: 7px 0 0;
      color: #64748b;
      font-size: 18px;
      font-weight: 850;
      line-height: 1.35;
    }

    .guide-example-ja {
      margin: 10px 0 0;
      color: #475569;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.45;
    }

    .guide-example-item {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .guide-example-head + .guide-example-item {
      border-top: 0;
    }

    .guide-example-subtitle {
      display: inline-flex;
      padding: 3px 9px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--guide-color, var(--blue)) 10%, white);
      color: var(--guide-color, var(--blue));
      font-size: 15px;
      font-weight: 950;
    }

    .category-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 16px;
    }

    .category-card {
      position: relative;
      min-height: 0;
      width: fit-content;
      padding: 8px 12px 8px 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      cursor: pointer;
      text-align: left;
      box-shadow: 0 10px 26px rgba(23, 32, 42, .08);
    }

    .category-card:hover,
    .category-card:focus-visible {
      border-color: var(--accent);
      outline: 0;
      transform: translateY(-1px);
    }

    .category-card strong {
      display: block;
      color: var(--accent);
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
    }

    tr[data-group-start],
    .mobile-vocab-card[data-group-start] {
      scroll-margin-top: 84px;
    }

    .jump-highlight {
      animation: jumpGlow 1.25s ease-out;
    }

    .practice-layout {
      display: grid;
      gap: 16px;
    }

    .practice-toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 10px 26px rgba(23, 32, 42, .08);
    }

    .reset-all-button {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      font-weight: 950;
    }

    .reset-all-button:hover {
      background: #1748bd;
    }

    .flash-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }

    .flash-card {
      min-height: 560px;
      display: grid;
      grid-template-rows: auto minmax(210px, 1fr);
      gap: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .82)),
        var(--flash-soft, var(--soft-blue));
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .flash-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: var(--flash-color, var(--blue));
    }

    .flash-kicker {
      color: var(--flash-color, var(--blue));
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .flash-term {
      margin: 4px 0 0;
      font-size: 44px;
      line-height: 1.08;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .flash-term-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
    }

    .flash-prompt {
      margin: 12px 0 0;
      color: var(--muted);
      font-weight: 800;
    }

    .flash-question {
      margin: 18px 0 0;
      padding: 14px 16px;
      border: 1px solid color-mix(in srgb, var(--flash-color, var(--blue)) 38%, var(--line));
      border-radius: 8px;
      background: var(--flash-soft, var(--soft-blue));
      color: var(--flash-color, var(--blue));
      font-size: 22px;
      font-weight: 900;
    }

    .flash-answer {
      display: grid;
      align-content: start;
      gap: 10px;
      min-height: 210px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .answer-box {
      min-height: 92px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .82);
      animation: rise .18s ease-out;
    }

    .answer-box span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .answer-box strong {
      display: block;
      font-size: 25px;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .flash-answer .pos {
      min-width: 132px;
      min-height: 50px;
      padding: 9px 18px;
      color: #fff;
      font-size: 25px;
      line-height: 1.15;
    }

    .flash-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 4px;
    }

    .flash-side .flash-actions {
      display: grid;
      margin-top: 14px;
    }

    .flash-side .flash-actions #showFlashAnswer {
      display: none;
    }

    .flash-button {
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-weight: 900;
    }

    .flash-button.primary {
      color: #fff;
      border-color: var(--flash-color, var(--blue));
      background: var(--flash-color, var(--blue));
    }

    .flash-flip-button {
      min-width: 96px;
      margin-top: 4px;
    }

    .flash-side {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      box-shadow: var(--shadow);
    }

    .flash-side h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .flash-side ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .problem {
      position: relative;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .problem-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, var(--problem-soft, #fbfcfd), #fff 68%);
    }

    .problem-head h2 {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0;
      color: var(--problem-color, var(--blue));
      text-transform: uppercase;
    }

    .problem-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }

    .problem-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--problem-color, var(--blue));
      color: white;
      font-size: 12px;
      font-weight: 900;
    }

    .question {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.45;
    }

    .blank {
      display: inline-block;
      min-width: 118px;
      min-height: 1.25em;
      padding: 0 8px 1px;
      border-bottom: 3px solid var(--problem-color, var(--blue));
      color: var(--problem-color, var(--blue));
      text-align: center;
      line-height: 1.1;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .choice {
      min-height: 52px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 8px 18px rgba(23, 32, 42, .06);
      transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;
    }

    .choice:hover {
      transform: translateY(-1px);
      border-color: var(--problem-color, #8ea0b4);
      box-shadow: 0 12px 24px rgba(23, 32, 42, .1);
    }

    .choice.selected {
      border-color: var(--problem-color, var(--blue));
      background: var(--problem-soft, var(--soft-blue));
    }

    .choice.correct {
      border-color: var(--green);
      background: var(--soft-green);
    }

    .choice.wrong {
      border-color: var(--red);
      background: var(--soft-red);
    }

    .solution {
      display: none;
      padding: 14px 16px 16px;
      background: linear-gradient(180deg, #fff, #f8fafc);
    }

    .solution.visible {
      display: block;
    }

    .steps {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: steps;
    }

    .step {
      display: none;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      color: #243447;
    }

    .step.question-step {
      background: var(--problem-soft, #f8fafc);
      border-color: color-mix(in srgb, var(--problem-color, var(--blue)) 38%, var(--line));
    }

    .step.question-step strong {
      color: var(--problem-color, var(--blue));
      font-size: 18px;
    }

    .step.answer-step {
      background: #fff;
      border-color: color-mix(in srgb, var(--problem-color, var(--blue)) 20%, var(--line));
    }

    .step.answer-step strong:first-child::after {
      content: " answer";
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .step.visible {
      display: grid;
      animation: rise .18s ease-out;
    }

    .step::before {
      counter-increment: steps;
      content: counter(steps);
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--problem-color, var(--ink));
      color: white;
      font-weight: 900;
    }

    .step strong {
      display: block;
      margin-bottom: 2px;
    }

    .step-title {
      color: #334155;
      font-size: 13px;
      text-transform: uppercase;
    }

    .step-value {
      color: var(--problem-color, var(--blue));
      font-weight: 950;
    }

    .step-candidate {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--problem-color, var(--blue));
      color: #fff;
      font-weight: 950;
      line-height: 1.25;
    }

    .step-note {
      display: block;
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 4px solid var(--problem-color, var(--blue));
      border-radius: 8px;
      background: var(--problem-soft, #f8fafc);
      color: #475569;
      font-size: 13px;
      font-weight: 800;
    }

    .step-meaning {
      color: var(--orange);
      font-weight: 950;
    }

    .step-answer {
      color: var(--green);
      font-weight: 950;
    }

    .step.good {
      border-color: rgba(15, 122, 95, .45);
      background: var(--soft-green);
    }

    .step.bad {
      border-color: rgba(183, 53, 53, .45);
      background: var(--soft-red);
    }

    .result {
      display: none;
      margin-top: 10px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 900;
    }

    .result.visible {
      display: block;
    }

    .result.good {
      border-color: rgba(15, 122, 95, .45);
      background:
        linear-gradient(135deg, rgba(13, 139, 104, .18), rgba(255, 255, 255, .7)),
        var(--soft-green);
      color: var(--green);
      box-shadow: 0 14px 30px rgba(13, 139, 104, .16);
    }

    .result.bad {
      border-color: rgba(183, 53, 53, .45);
      background: var(--soft-red);
      color: var(--red);
    }

    .result-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 21px;
      line-height: 1.25;
    }

    .result.good .result-title {
      color: #087455;
      font-size: 24px;
    }

    .result-answer {
      display: inline-flex;
      align-items: center;
      margin-left: 4px;
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      color: var(--ink);
    }

    .result-detail {
      display: block;
      color: #334155;
      font-weight: 800;
    }

    .result-translation {
      display: block;
      margin-top: 8px;
      color: #334155;
      font-weight: 900;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .small-button {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-weight: 800;
    }

    .small-button:hover {
      border-color: var(--problem-color, var(--blue));
      background: var(--problem-soft, var(--soft-blue));
    }

    .note {
      color: var(--muted);
      font-size: 13px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes jumpGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(35, 88, 216, .34);
        background-color: rgba(35, 88, 216, .12);
      }
      100% {
        box-shadow: 0 0 0 18px rgba(35, 88, 216, 0);
        background-color: transparent;
      }
    }

    @media (max-width: 850px) {
      .page {
        padding: 14px;
      }

      header,
      .sheet-title,
      .controls {
        display: grid;
      }

      header {
        grid-template-columns: 1fr;
      }

      table {
        min-width: 900px;
      }

      .sheet {
        overflow-x: auto;
      }

      .hint-line,
      .guide-type-grid,
      .guide-pattern-list,
      .flash-layout,
      .choices {
        grid-template-columns: 1fr;
      }

      .flash-answer {
        grid-template-columns: 1fr;
      }

      .tab {
        min-width: 0;
        flex: 1;
      }
    }

    @media (max-width: 560px) {
      .page {
        padding: 10px;
      }

      header {
        padding: 16px;
      }

      h1 {
        font-size: 25px;
      }

      .credit {
        white-space: normal;
      }

      .tabs {
        position: sticky;
        top: 0;
        z-index: 10;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .tab {
        flex: 0 0 auto;
        min-width: 118px;
        padding: 9px 12px;
        white-space: nowrap;
      }

      .category-grid,
      .hint-line {
        gap: 8px;
      }

      .guide-board {
        padding: 16px;
      }

      .guide-type-button {
        min-height: 112px;
        padding: 15px;
      }

      .guide-type-button strong {
        font-size: 26px;
      }

      .guide-board-head h2 {
        font-size: 27px;
      }

      .guide-pattern-main {
        font-size: 32px;
      }

      .guide-example-en {
        font-size: 21px;
      }

      .guide-example-ja {
        font-size: 18px;
      }

      .sheet {
        display: none;
      }

      .mobile-vocab {
        display: block;
      }

      .flash-card {
        min-height: 560px;
        padding: 18px;
      }

      .flash-term {
        font-size: 34px;
      }

      .flash-term-row {
        grid-template-columns: 1fr;
      }

      .flash-flip-button {
        width: 100%;
        margin-top: 0;
      }

      .flash-question {
        font-size: 18px;
      }

      .answer-box strong {
        font-size: 22px;
      }

      .flash-answer .pos {
        min-height: 46px;
        font-size: 22px;
      }

      .question {
        font-size: 17px;
      }

      .problem-head,
      .choices,
      .solution {
        padding-left: 12px;
        padding-right: 12px;
      }

      .step {
        grid-template-columns: 30px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="title-row">
        <h1>接続詞・前置詞・接続副詞 TOEIC頻出語彙</h1>
        <span class="credit">Developed by Sho Nakai (Kansai University)</span>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="教材タブ">
      <button class="tab active" role="tab" aria-selected="true" data-tab="guide">文構造</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="table">語彙表</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="flash">フラッシュカード</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="practice">練習問題</button>
    </div>

    <section id="guide" class="panel active" role="tabpanel">
      <div class="guide-shell">
        <div class="guide-type-grid" aria-label="品詞別の文構造">
          <button class="guide-type-button" type="button" style="--guide-color: var(--blue)" data-guide-type="conj">
            <strong>接続詞</strong>
          </button>
          <button class="guide-type-button" type="button" style="--guide-color: var(--green)" data-guide-type="prep">
            <strong>前置詞</strong>
          </button>
          <button class="guide-type-button" type="button" style="--guide-color: var(--orange)" data-guide-type="adv">
            <strong>接続副詞</strong>
          </button>
          <button class="guide-type-button" type="button" style="--guide-color: var(--violet)" data-guide-type="inf">
            <strong>不定詞</strong>
          </button>
        </div>
        <div class="guide-board" id="guideBoard" aria-live="polite">
          <div class="guide-empty">品詞をクリックすると、文構造が大きく表示されます。</div>
        </div>
      </div>
    </section>

    <section id="table" class="panel" role="tabpanel">
      <div class="category-grid" id="categoryGrid" aria-label="意味カテゴリー"></div>

      <div class="sheet">
        <div class="sheet-title">
          <span>語彙・意味・品詞・文構造</span>
          <span>空欄直後の形でまず品詞を決める</span>
        </div>
        <table aria-label="TOEIC頻出語彙表">
          <thead>
            <tr>
              <th style="width: 13%">カテゴリー</th>
              <th style="width: 25%">語彙</th>
              <th style="width: 20%">意味</th>
              <th style="width: 13%">品詞</th>
              <th style="width: 29%">文構造</th>
            </tr>
          </thead>
          <tbody id="vocabRows"></tbody>
        </table>
      </div>

      <div class="mobile-vocab" aria-label="スマホ用語彙カード">

      </div>

      <div class="structure-example" id="structureExample" aria-live="polite"></div>
    </section>

    <section id="flash" class="panel" role="tabpanel">
      <div class="flash-layout">
        <article class="flash-card" id="flashCard" aria-live="polite">
          <div>
            <div class="flash-kicker" id="flashKicker">Random card</div>
            <div class="flash-term-row">
              <h2 class="flash-term" id="flashTerm">Loading...</h2>
              <button class="flash-button primary flash-flip-button" id="showFlashAnswer">めくる</button>
            </div>
            <p class="flash-prompt">質問に声で答えてから、めくって確認します。</p>
            <div class="flash-question" id="flashQuestion">品詞は？</div>
          </div>

          <div class="flash-answer" id="flashAnswer"></div>

        </article>

        <aside class="flash-side">
          <h2>答えること</h2>
          <ul>
            <li>1. 日本語の意味</li>
            <li>2. 品詞: 接続詞 / 前置詞 / 接続副詞 / 不定詞</li>
            <li>3. 後ろに続く形: S V / 名詞 / 文全体 / 動詞の原形</li>
          </ul>
          <div class="flash-actions">
            <button class="flash-button" id="nextFlashCard">次のカード</button>
            <button class="flash-button" id="shuffleFlashCards">シャッフル</button>
          </div>
        </aside>
      </div>
    </section>

    <section id="practice" class="panel" role="tabpanel">
      <div class="practice-toolbar">
        <button class="reset-all-button" type="button" id="resetAllProblems">全ての設問をリセット</button>
      </div>
      <div class="practice-layout" id="practiceList"></div>
    </section>
  </div>

  <script>
    const vocab = [
      { term: "although / even though", meaning: "にもかかわらず、だけれど", pos: "接続詞", pattern: "〜 S V, S V", group: "逆接" },

      { term: "while", meaning: "あいだ", pos: "接続詞", pattern: "〜 S V, S V", group: "時間" },
      { term: "during", meaning: "あいだ", pos: "前置詞", pattern: "〜 名, S V", group: "時間" },
      { term: "instead of", meaning: "かわりに", pos: "前置詞", pattern: "〜 名, S V", group: "代替" },

      { term: "unless", meaning: "でなければ", pos: "接続詞", pattern: "〜 S V, S V", group: "条件" },
      { term: "without", meaning: "でなければ", pos: "前置詞", pattern: "〜 名, S V", group: "条件" },
      { term: "otherwise", meaning: "でなければ", pos: "副詞", pattern: "〜, S V.", group: "条件" },
      { term: "so that / in order that", meaning: "するために", pos: "接続詞", pattern: "S V 〜 S V / 〜 S V, S V", group: "目的" },
      { term: "so as to / in order to", meaning: "するために", pos: "不定詞", pattern: "〜 V（原形）", group: "目的" },
      { term: "as long as", meaning: "する限り", pos: "接続詞", pattern: "〜 S V, S V", group: "条件" },
      { term: "now that", meaning: "今では〜なので", pos: "接続詞", pattern: "〜 S V, S V", group: "理由" },

    const problems = [
      {
        sentence: "_____ the tight deadline, the team completed the report.",
        choices: ["Although", "Despite", "Nevertheless", "Because"],
        answer: "Despite",
        afterBlank: "the tight deadline",
        structure: "名詞句",
        allowed: "前置詞",

        meaningQuestion: "厳しい締切（？）、チームは報告書を完成させた。",
        meaningAnswer: "厳しい締切「にもかかわらず」、チームは報告書を完成させた。",
        translation: "厳しい締切にもかかわらず、チームは報告書を完成させた。",
        translationTarget: "にもかかわらず",
        eliminate: "Although / Because は後ろに S V が必要。Nevertheless は副詞なので、直後に名詞だけを置けない。",
        final: "直後が名詞句なので前置詞に絞る。意味は「厳しい締切にもかかわらず」なので despite。"
      },
      {
        sentence: "_____ sales increased, the company hired more staff.",
        choices: ["Because of", "Because", "Therefore", "During"],
        answer: "Because",
        afterBlank: "sales increased",
        structure: "S V",
        allowed: "接続詞",
        posChoices: "接続詞として使える選択肢は Because のみ。",
        candidateChoices: "Because",
        group: "理由",
        meaningNeed: "なので",
        meaningQuestion: "売上が伸びた（？）、その会社はより多くのスタッフを雇った。",
        meaningAnswer: "売上が伸びた「ので」、その会社はより多くのスタッフを雇った。",
        translation: "売上が伸びたので、その会社はより多くのスタッフを雇った。",

      {

        candidateChoices: "otherwise",
        group: "条件",
        meaningNeed: "そうでなければ",
        meaningQuestion: "本日中に予約を確認してください。（？）、席が解放される可能性があります。",

        translationTarget: "そうでなければ",
        eliminate: "Unless は接続詞なので後ろに S V を直接続ける。ここは空欄の直後がコンマ + S V なので、接続副詞の形。Without / instead of は後ろに名詞が必要。",

      },
      {

        candidateChoices: "During",
        group: "時間",

    function styleVars(group) {
      const style = groupStyle[group];
      return `--group-color:${style.color};--group-soft:${style.soft};--accent:${style.color};--problem-color:${style.color};--problem-soft:${style.soft}`;
    }

    function displayPos(pos) {
      return pos === "副詞" ? "接続副詞" : pos;
    }

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    const flashVocab = vocab.flatMap(item =>
      item.term.split(/\s+\/\s+/).map(term => ({ ...item, term }))
    );

    let flashOrder = shuffle(flashVocab.map((_, index) => index));
    let flashCursor = 0;
    let flashStep = 0;

    function currentFlashItem() {
      return flashVocab[flashOrder[flashCursor]];
    }

    function flashStages(item) {
      return [
        { question: "意味は？", label: "意味", answer: item.meaning },
        { question: "品詞は？", label: "品詞", answer: `<span class="pos ${posClass[item.pos]}">${displayPos(item.pos)}</span>` },
        { question: "後ろに続く形は？", label: "後ろに続く文構造", answer: item.pattern },
      ];
    }

    function renderFlashStage() {
      const item = currentFlashItem();
      const stages = flashStages(item);
      const answerHtml = stages.slice(0, flashStep).map(stage => `
        <div class="answer-box"><span>${stage.label}</span><strong>${stage.answer}</strong></div>
      `).join("");
      document.querySelector("#flashAnswer").innerHTML = answerHtml;
      document.querySelector("#flashQuestion").textContent = flashStep < stages.length
        ? stages[flashStep].question
        : "全部言えた？次のカードへ";
      document.querySelector("#showFlashAnswer").textContent = flashStep < stages.length ? "めくる" : "次のカード";
    }

    function renderFlashCard() {
      if (flashCursor >= flashOrder.length) {
        flashOrder = shuffle(flashVocab.map((_, index) => index));
        flashCursor = 0;
      }
      flashStep = 0;
      const item = currentFlashItem();
      const style = groupStyle[item.group];
      const card = document.querySelector("#flashCard");
      card.style.setProperty("--flash-color", style.color);
      card.style.setProperty("--flash-soft", style.soft);
      document.querySelector("#flashKicker").textContent = `${item.group} / ${style.label}`;
      document.querySelector("#flashTerm").textContent = item.term;
      renderFlashStage();
    }

    function renderCategories() {
      const groups = Object.keys(groupStyle);
      document.querySelector("#categoryGrid").innerHTML = groups.map(group => {
        const count = vocab.filter(item => item.group === group).length;
        const meanings = [...new Set(vocab.filter(item => item.group === group).map(item => item.meaning))].join(" / ");
        return `
          <button class="category-card" type="button" style="--accent:${groupStyle[group].color}" data-scroll-group="${group}">
            <strong>${group}</strong>
          </button>
        `;
      }).join("");
    }

    function tableRows() {
      const groupOrder = Object.keys(groupStyle);
      const items = [...vocab].sort((a, b) => {
        const groupDiff = groupOrder.indexOf(a.group) - groupOrder.indexOf(b.group);
        if (groupDiff !== 0) return groupDiff;
        if (a.meaning !== b.meaning) return a.meaning.localeCompare(b.meaning, "ja");
        return 0;
      });

      return items.map((item, index) => {
        const firstInGroup = index === 0 || items[index - 1].group !== item.group;
        const firstInMeaning = firstInGroup || items[index - 1].meaning !== item.meaning;
        const groupSpan = firstInGroup ? items.filter(other => other.group === item.group).length : 0;
        const meaningSpan = firstInMeaning
          ? items.filter(other => other.group === item.group && other.meaning === item.meaning).length
          : 0;
        return { item, firstInGroup, firstInMeaning, groupSpan, meaningSpan };
      });
    }

    function renderTable() {
      const rows = tableRows();
      document.querySelector("#vocabRows").innerHTML = rows.map(row => `
        <tr style="${styleVars(row.item.group)}" data-group="${row.item.group}" ${row.firstInGroup ? `data-group-start="${row.item.group}"` : ""}>
          ${row.firstInGroup ? `<td class="merged-cell" rowspan="${row.groupSpan}"><span class="group-badge">${row.item.group}</span></td>` : ""}
          <td class="term">${row.item.term}</td>
          ${row.firstInMeaning ? `<td class="merged-cell meaning" rowspan="${row.meaningSpan}">${row.item.meaning}</td>` : ""}
          <td><span class="pos ${posClass[row.item.pos]}">${row.item.pos}</span></td>
          <td class="pattern"><button class="pattern-button" data-example-term="${row.item.term}">${row.item.pattern}</button></td>
        </tr>
      `).join("");
      document.querySelector("#mobileVocabList").innerHTML = rows.map(row => `
        <article class="mobile-vocab-card" style="${styleVars(row.item.group)}" data-group="${row.item.group}" ${row.firstInGroup ? `data-group-start="${row.item.group}"` : ""}>
          <div class="mobile-vocab-head">
            <span class="group-badge">${row.item.group}</span>
            <span class="pos ${posClass[row.item.pos]}">${row.item.pos}</span>
          </div>
          <h2 class="mobile-vocab-term">${row.item.term}</h2>
          <div class="mobile-vocab-grid">
            <div class="mobile-field"><span>意味</span><strong>${row.item.meaning}</strong></div>
            <div class="mobile-field"><span>文構造</span><button class="pattern-button" data-example-term="${row.item.term}">${row.item.pattern}</button></div>
          </div>
        </article>
      `).join("");
    }

    function highlightText(text, target) {
      if (!target || !text.includes(target)) return text;
      return text.replace(target, `<span class="example-highlight">${target}</span>`);
    }

    function highlightAllText(text, target) {
      const targets = Array.isArray(target) ? target : [target];
      return targets.filter(Boolean).reduce((result, item) => {
        if (!result.includes(item)) return result;
        return result.split(item).join(`<span class="example-highlight">${item}</span>`);
      }, text);
    }

    function highlightedTranslation(problem) {
      return highlightText(problem.translation, problem.translationTarget);
    }

    function jumpToVocabGroup(group) {
      const mobileVisible = getComputedStyle(document.querySelector("#mobileVocabList").closest(".mobile-vocab")).display !== "none";
      const candidates = [...document.querySelectorAll(mobileVisible ? ".mobile-vocab-card[data-group-start]" : "tr[data-group-start]")];
      const target = candidates.find(element => element.dataset.groupStart === group);
      if (!target) return;

      target.scrollIntoView({ behavior: "smooth", block: "start" });
      target.classList.remove("jump-highlight");
      void target.offsetWidth;
      target.classList.add("jump-highlight");
    }

    function updateGuideTypeButtons() {
      document.querySelectorAll("[data-guide-type]").forEach(button => {
        button.classList.toggle("active", button.dataset.guideType === activeGuideType);
      });
    }

    function renderGuideBoard() {
      const board = document.querySelector("#guideBoard");
      if (!activeGuideType) {
        board.innerHTML = `<div class="guide-empty">品詞をクリックすると、文構造が大きく表示されます。</div>`;
        return;
      }

      const guide = guideData[activeGuideType];
      const activePattern = guide.patterns.find(pattern => pattern.id === activeGuidePattern);
      board.style.setProperty("--guide-color", guide.color);
      board.style.setProperty("--example-color", guide.color);
      board.innerHTML = `
        <div class="guide-board-head">
          <h2>${guide.label}</h2>
          <button class="guide-close" type="button" data-guide-board-close>閉じる</button>
        </div>
        <div class="guide-pattern-list">
          ${guide.patterns.map(pattern => `
            <button class="guide-pattern-button ${pattern.id === activeGuidePattern ? "active" : ""}" type="button" data-guide-pattern="${pattern.id}">
              <span class="guide-pattern-label">${pattern.label}</span>
              <span class="guide-pattern-main">${pattern.structure}</span>
            </button>
          `).join("")}
        </div>
        <div class="guide-example-panel ${activePattern ? "visible" : ""}">
          ${activePattern ? guideExampleHtml(activePattern) : ""}
        </div>
      `;
    }

    function guideExampleHtml(pattern) {
      const examples = pattern.examples || [pattern];
      return `
        <div class="guide-example-head">
          <div class="guide-example-kicker">${pattern.label}</div>
          <button class="guide-close" type="button" data-guide-close>閉じる</button>
        </div>
        ${examples.map(example => {
          const enLines = example.enLines || [example.en];
          return `
            <div class="guide-example-item">
              ${example.label ? `<div class="guide-example-subtitle">${example.label}</div>` : ""}
              ${enLines.map(line => {
                const text = typeof line === "string" ? line : line.text;
                const className = typeof line === "string" || !line.note ? "guide-example-en" : "guide-example-note";
                return `<p class="${className}">${highlightAllText(text, example.enTarget)}</p>`;
              }).join("")}
              <p class="guide-example-ja">${highlightAllText(example.ja, example.jaTarget)}</p>
            </div>
          `;
        }).join("")}
      `;
    }

    function selectGuideType(type) {
      activeGuideType = type;
      activeGuidePattern = "";
      updateGuideTypeButtons();
      renderGuideBoard();
    }

    function selectGuidePattern(patternId) {
      activeGuidePattern = patternId;
      renderGuideBoard();
    }

    function closeGuideExample() {
      activeGuidePattern = "";
      renderGuideBoard();
    }

    function closeGuideBoard() {
      activeGuideType = "";
      activeGuidePattern = "";
      updateGuideTypeButtons();
      renderGuideBoard();
    }

    function positionStructureExample(panel, button) {
      const rect = button.getBoundingClientRect();
      panel.classList.remove("left-tail");
      const gap = 14;
      const margin = 12;
      const panelWidth = Math.min(420, window.innerWidth - margin * 2);
      let left = rect.right + gap;
      let top = rect.top;

      if (left + panelWidth > window.innerWidth - margin) {
        left = rect.left - panelWidth - gap;
        panel.classList.add("left-tail");
      }

      if (left < margin) left = margin;

      const panelHeight = panel.offsetHeight || 180;
      if (top + panelHeight > window.innerHeight - margin) {
        top = Math.max(margin, window.innerHeight - panelHeight - margin);
      }

      panel.style.left = `${left}px`;
      panel.style.top = `${top}px`;
    }

    function hideStructureExample() {
      const panel = document.querySelector("#structureExample");
      panel.classList.remove("visible", "left-tail");
    }

    function showStructureExample(term, button) {
      const item = vocab.find(entry => entry.term === term);
      const example = structureExamples[term];
      if (!item || !example) return;

      const panel = document.querySelector("#structureExample");
      const style = groupStyle[item.group];
      panel.style.setProperty("--example-color", style.color);
      panel.classList.add("visible");
      panel.innerHTML = `
        <div class="structure-example-head">
          <h2>${item.term} / ${item.pattern}</h2>
          <button class="structure-close" type="button" data-close-example>閉じる</button>
        </div>
        <p class="example-en">${highlightText(example.en, example.enTarget)}</p>
        <p class="example-ja">${highlightText(example.ja, example.jaTarget)}</p>
      `;
      positionStructureExample(panel, button);
    }

    function practiceSteps(problem) {
      const steps = [
        { type: "question", title: problem.step1Question || "空欄直後の形は？", body: "" },
        { type: "answer", title: "形", body: problem.step1Answer || `「<span class="step-value">${problem.afterBlank}</span>」なので <span class="step-candidate">${problem.structure}</span>。` },
        { type: "question", title: problem.step2Question || "どの品詞？", body: "" },
        { type: "answer", title: problem.step2Title || "品詞", body: `<span class="step-candidate">${displayPos(problem.allowed)}</span>` },
        { type: "question", title: problem.candidateQuestion || `どの選択肢が${displayPos(problem.allowed)}？`, body: "" },
        { type: "answer", title: "候補", body: `<span class="step-candidate">${problem.candidateChoices}</span><span class="step-note">補足: ${problem.eliminate}</span>` }
      ];

      if (problem.candidateChoices.includes(" / ")) {
        steps.push(
        { type: "question", title: "文意に合うのは？", body: "" },
        { type: "answer", title: "意味確認", body: `<span class="step-meaning">${problem.meaningQuestion}</span>` },
        { type: "answer", title: "判断", body: `${problem.meaningAnswer}<br>したがって正解は <span class="step-answer">${problem.answer}</span>。` }
        );
      }

      return steps;
    }

    function renderPractice() {
      document.querySelector("#practiceList").innerHTML = problems.map((problem, index) => `
        <article class="problem" data-index="${index}" style="--problem-color:#2358d8;--problem-soft:#eef4ff">
          <div class="problem-head">
            <div class="problem-meta">
              <h2>Question ${index + 1}</h2>
            </div>
            <p class="question">${problem.sentence.replace("_____", '<span class="blank"></span>')}</p>
          </div>
          <div class="choices">
            ${problem.choices.map(choice => `<button class="choice" data-choice="${choice}">${choice}</button>`).join("")}
          </div>
          <div class="solution" aria-live="polite">
            <ol class="steps">
              ${practiceSteps(problem).map(step => `
                <li class="step ${step.type}-step"><div><strong class="step-title">${step.title}</strong>${step.body}</div></li>
              `).join("")}
            </ol>
            <div class="result"></div>
            <div class="controls">
              <span class="note">選択肢をクリックするたびに、解説が1ステップずつ進みます。</span>
              <button class="small-button" data-reset="${index}">この問題をリセット</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab").forEach(tab => {
        const active = tab.dataset.tab === tabName;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", active ? "true" : "false");
      });
      document.querySelectorAll(".panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === tabName);
      });
    }

    function resetProblem(problemEl) {
      problemEl.dataset.step = "0";
      problemEl.querySelector(".blank").textContent = "";
      problemEl.querySelector(".solution").classList.remove("visible");
      problemEl.querySelectorAll(".choice").forEach(choice => {
        choice.classList.remove("selected", "correct", "wrong");
      });
      problemEl.querySelectorAll(".step").forEach(step => {
        step.classList.remove("visible", "good", "bad");
      });
      const result = problemEl.querySelector(".result");
      result.className = "result";
      result.textContent = "";
    }

    function resetAllProblems() {
      document.querySelectorAll(".problem").forEach(resetProblem);
    }

    function selectChoice(button) {
      const problemEl = button.closest(".problem");
      const problem = problems[Number(problemEl.dataset.index)];
      const selected = button.dataset.choice;
      const correct = selected === problem.answer;
      const totalSteps = practiceSteps(problem).length;
      const nextStep = Math.min(Number(problemEl.dataset.step || "0") + 1, totalSteps);
      const showResult = nextStep === totalSteps;
      problemEl.dataset.step = String(nextStep);

      problemEl.querySelector(".solution").classList.add("visible");
      problemEl.querySelector(".blank").textContent = selected;
      problemEl.querySelectorAll(".choice").forEach(choice => {
        choice.classList.toggle("selected", choice === button);
        choice.classList.toggle("correct", choice.dataset.choice === problem.answer && showResult);
        choice.classList.toggle("wrong", choice === button && !correct && showResult);
      });

      problemEl.querySelectorAll(".step").forEach((step, index) => {
        const visible = index < nextStep;
        step.classList.toggle("visible", visible);
      });

      const result = problemEl.querySelector(".result");
      result.classList.toggle("visible", showResult);
      result.classList.toggle("good", showResult && correct);
      result.classList.toggle("bad", showResult && !correct);
      result.innerHTML = showResult
        ? correct
          ? `<span class="result-title">🎉 正解！<span class="result-answer">${problem.answer}</span></span><span class="result-detail">${problem.final}</span><span class="result-translation">和訳: ${highlightedTranslation(problem)}</span>`
          : `<span class="result-title">もう一歩。正解は <span class="result-answer">${problem.answer}</span></span><span class="result-detail">あなたの選択は ${selected}。${problem.final}</span><span class="result-translation">和訳: ${highlightedTranslation(problem)}</span>`
        : "";
    }

    document.addEventListener("click", event => {
      if (event.target.closest("[data-close-example]")) {
        hideStructureExample();
        return;
      }

      if (
        document.querySelector("#structureExample").classList.contains("visible") &&
        !event.target.closest("#structureExample") &&
        !event.target.closest("[data-example-term]")
      ) {
        hideStructureExample();
      }

      if (event.target.closest("[data-guide-close]")) {
        closeGuideExample();
        return;
      }

      if (event.target.closest("[data-guide-board-close]")) {
        closeGuideBoard();
        return;
      }

      const guideType = event.target.closest("[data-guide-type]");
      if (guideType) {
        selectGuideType(guideType.dataset.guideType);
        return;
      }

      const guidePattern = event.target.closest("[data-guide-pattern]");
      if (guidePattern) {
        selectGuidePattern(guidePattern.dataset.guidePattern);
        return;
      }

      const tab = event.target.closest(".tab");
      if (tab) {
        switchTab(tab.dataset.tab);
        return;
      }

      const patternButton = event.target.closest("[data-example-term]");
      if (patternButton) {
        showStructureExample(patternButton.dataset.exampleTerm, patternButton);
        return;
      }

      const categoryButton = event.target.closest("[data-scroll-group]");
      if (categoryButton) {
        jumpToVocabGroup(categoryButton.dataset.scrollGroup);
        return;
      }

      if (event.target.closest("#showFlashAnswer")) {
        const stages = flashStages(currentFlashItem());
        if (flashStep >= stages.length) {
          flashCursor += 1;
          renderFlashCard();
        } else {
          flashStep += 1;
          renderFlashStage();
        }
        return;
      }

      if (event.target.closest("#nextFlashCard")) {
        flashCursor += 1;
        renderFlashCard();
        return;
      }

      if (event.target.closest("#shuffleFlashCards")) {
        flashOrder = shuffle(flashVocab.map((_, index) => index));
        flashCursor = 0;
        renderFlashCard();
        return;
      }

      if (event.target.closest("#resetAllProblems")) {
        resetAllProblems();
        return;
      }

      const choice = event.target.closest(".choice");
      if (choice) {
        selectChoice(choice);
        return;
      }

      const reset = event.target.closest("[data-reset]");
      if (reset) resetProblem(reset.closest(".problem"));
    });

    renderCategories();
    renderTable();
    renderFlashCard();
    renderPractice();
  </script>
</body>
</html>
